name: Build

# Runs only when source files change on main, so dist stays in sync without
# triggering an infinite loop (the commit back uses [skip ci]).
on:
  push:
    branches: [main]
    paths:
      - "src/**"

jobs:
  build:
    name: Minify and commit dist
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the full ref so the bot can push back to the same branch.
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build minified dist
        run: npm run build

      - name: Commit dist files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet && echo "No dist changes." && exit 0
          git commit -m "chore: build minified dist [skip ci]"
          git push
